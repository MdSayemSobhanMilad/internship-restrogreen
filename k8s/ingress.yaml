apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restrogreen-ingress
  namespace: restrogreen
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
  - host: restrogreen.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: restrogreen-service
            port:
              number: 80