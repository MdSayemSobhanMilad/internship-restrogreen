apiVersion: apps/v1
kind: Deployment
metadata:
  name: restrogreen-app
  namespace: restrogreen
spec:
  replicas: 3
  selector:
    matchLabels:
      app: restrogreen
  template:
    metadata:
      labels:
        app: restrogreen
    spec:
      containers:
      - name: restrogreen
        image: restrogreen:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: restrogreen-config
        - secretRef:
            name: restrogreen-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: restrogreen-service
  namespace: restrogreen
spec:
  selector:
    app: restrogreen
  ports:
  - port: 80
    targetPort: 3000
    name: http
  type: ClusterIP