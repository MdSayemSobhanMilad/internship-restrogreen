<VirtualHost *:80>
    ServerName restrogreen.example.com
    ServerAdmin admin@restrogreen.com
    
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName restrogreen.example.com
    ServerAdmin admin@restrogreen.com

    SSLEngine On
    SSLCertificateFile /etc/ssl/certs/restrogreen.crt
    SSLCertificateKeyFile /etc/ssl/private/restrogreen.key

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ProxyPreserveHost On
    ProxyPass / http://restrogreen-service.restrogreen.svc.cluster.local:3000/
    ProxyPassReverse / http://restrogreen-service.restrogreen.svc.cluster.local:3000/

    ProxyTimeout 300
    Timeout 300

    SetOutputFilter DEFLATE
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json

    <LocationMatch "^/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/restrogreen-error.log
    CustomLog ${APACHE_LOG_DIR}/restrogreen-access.log combined
</VirtualHost>